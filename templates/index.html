<!--Interface de la calculatrice.

Ce gabarit HTML est rendu par Flask via la fonction index() du module app.py.
Les balises entre doubles accolades y sont remplacées avant l'envoi de la page au navigateur.
-->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flask Calculator</title>
<!-- url_for génère le chemin vers static/style.css -->
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="calculator">
   <h1>Flask Calculator</h1>
   <!-- Après soumission, le formulaire est envoyé en méthode POST sur la route "/"-->
   <form method="POST">
      <!-- Ce champ porte le nom "display". C'est ce qui est lu par app.py pour 
       récupérer l'expression. Il est en lecture uniquement donc la saisie ne se fait
       qu'avec les boutons de l'interface. Après un calcul, Flask y insère le 
       résultat ou le message d'erreur. -->
      <input type="text" name="display" id="display" value="{{ result }}" readonly>

      <!-- Les boutons de type button modifient l'écran sans envoyer le formulaire.
       Le calcul est uniquement envoyé à l'appui du bouton "=" car il est de type submit. -->
      <div class="buttons">
         <button type="button" class="btn" onclick="appendToDisplay('1')">1</button>
         <button type="button" class="btn" onclick="appendToDisplay('2')">2</button>
         <button type="button" class="btn" onclick="appendToDisplay('3')">3</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('+')">+</button>

         <button type="button" class="btn" onclick="appendToDisplay('4')">4</button>
         <button type="button" class="btn" onclick="appendToDisplay('5')">5</button>
         <button type="button" class="btn" onclick="appendToDisplay('6')">6</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('-')">-</button>

         <button type="button" class="btn" onclick="appendToDisplay('7')">7</button>
         <button type="button" class="btn" onclick="appendToDisplay('8')">8</button>
         <button type="button" class="btn" onclick="appendToDisplay('9')">9</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('*')">*</button>

         <button type="button" class="btn" onclick="appendToDisplay('0')">0</button>
         <button type="button" class="btn" onclick="clearDisplay()">C</button>
         <button type="submit" class="btn operator">=</button>
         <button type="button" class="btn operator" onclick="appendToDisplay('/')">/</button>
      </div>
   </form>
</div>

<script>
   // Vrai quand l'écran affiche le résultat ou l'erreur du calcul précédent.
   let resultShown = document.getElementById('display').value !== '';

   /**
    * Ajoute un caractère à la fin de l'expression affichée à l'écran.
    * Si l'écran affiche un résultat, il est d'abord vidé pour commencer
    * un nouveau calcul.
    *
    * @param {string} value Chiffre ou opérateur à ajouter.
    * @returns {void}
   */
   function appendToDisplay(value) {
      
      const display = document.getElementById('display');
      if (resultShown) {
         display.value = '';
         resultShown = false;
      }
      display.value += value;
   }

   /**
    * Efface l'expression affichée à l'écran.
    *
    * @returns {void}
   */
   function clearDisplay() {
      document.getElementById('display').value = '';
      resultShown = false;
   }
</script>
</body>
</html>
